# ── Sectors / Themes ─────────────────────────────────────────────────────────
#
# Machine-readable sector block (P1-2 language unification).
# The top-level `sectors` key is loaded by src/utils/entity_canonical.py:
#   1. aliases merged into ALIAS_MAP → canonical_name() normalizes sector
#      fields (e.g. "Tech" → "科技", "STAR Market" → "科创板")
#   2. canonical names injected into extraction prompts as
#      CANONICAL SECTOR NAMES (macro + symbol pipelines share Chinese names)
#
# Maintenance rules (P1-1 sector admission):
#   - canonical 必须是股票市场可交易的行业/板块/概念中文名
#   - 禁止收录：指数、政策概念、族群、学术/哲学领域、媒体栏目、
#     应急服务机构等非行业实体
