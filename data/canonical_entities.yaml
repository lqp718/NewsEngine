# canonical_entities.yaml — High-frequency entity canonical name mapping
#
# Format: canonical_name: [alias1, alias2, ...]
#
# This file defines the canonical (preferred) name for each entity and lists
# all known aliases/variations that should map to it.
#
# Used by entity_canonical.py for normalization to reduce duplicate entities
# in the knowledge graph (e.g., "Tencent" / "Tencent Holdings" / "腾讯控股"
# all map to the canonical name "腾讯控股").
#
# Maintenance:
#   - Add new entities as they are discovered in the corpus
#   - Keep aliases exhaustive to maximize deduplication
#   - Canonical names should be the most commonly used form in Chinese media
#   - Top 50 high-frequency entities (expand as needed)

